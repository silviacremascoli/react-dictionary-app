[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/pronunciation"
  to = "/.netlify/functions/pronunciation"
  status = 200

[[redirects]]
  from = "/api/images"
  to = "/.netlify/functions/images"
  status = 200
